name: Update Ezoic ads.txt

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ads-txt:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Ezoic ads.txt
        run: |
          curl -fL "https://srv.adstxtmanager.com/19390/voxoira.com" -o ads.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ads.txt

          if git diff --cached --quiet; then
            echo "No changes to ads.txt"
          else
            git commit -m "Update Ezoic ads.txt"
            git push
          fi

